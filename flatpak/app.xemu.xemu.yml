# PenguinBox flatpak manifest.
#
# Adapted from the official Flathub xemu manifest (flathub/app.xemu.xemu). The
# ONLY substantive change is the `xemu` module source: instead of pulling a
# xemu release tarball, it builds THIS working tree (type: dir), so the flatpak
# contains the PenguinBox fork — the Steel Battalion perf work, the SBC overlay,
# and the (Linux-only) VR path.
#
# Built by:  ./build-release.sh linux
#
# NOTE: app-id is still app.xemu.xemu for now (keeps every icon/desktop/metainfo
# id consistent with upstream so the bundle Just Works). Rebranding the app-id to
# app.penguinvr.PenguinBox is a deliberate follow-up (it collides with a
# Flathub-installed xemu until then).
app-id: app.xemu.xemu
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: xemu
rename-desktop-file: xemu.desktop
finish-args:
  - --device=all
  - --filesystem=host:ro
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland
  - --env=SDL_VIDEODRIVER=wayland,x11
  - --share=ipc
  # openSUSE defines QEMU_AUDIO_DRV=pa which stops xemu launching; unset it.
  - --unset-env=QEMU_AUDIO_DRV

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'

modules:
  - name: libpcap
    buildsystem: cmake-ninja
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.tcpdump.org/release/libpcap-1.10.6.tar.gz
        sha256: 872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9

  - name: libslirp
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.gz
        sha256: 3970542143b7c11e6a09a4d2b50f30a133473c41f15ed0bdcc3b7a1c450d9a5c

  - name: PyYAML
    buildsystem: simple
    build-commands:
      - pip install --prefix=/app --no-build-isolation .
    sources:
      - type: archive
        url: https://github.com/yaml/pyyaml/archive/refs/tags/6.0.3.tar.gz
        sha256: c7b45011e052458ae79015d5eea3046c37d099023d4b253dde26ee1c29ea2f36

  - name: distlib
    buildsystem: simple
    build-commands:
      - pip install --prefix=/app --no-build-isolation .
    sources:
      - type: archive
        url: https://github.com/pypa/distlib/archive/refs/tags/0.4.3.tar.gz
        sha256: 421a2a177a9c6a725d821c27e69e9e06429dd6b9d9c44c51689412fb61936b51

  - name: xxhash
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.3.tar.gz
        sha256: aae608dfe8213dfd05d909a57718ef82f30722c392344583d3f39050c7f29a80

  - name: xemu
    buildsystem: autotools
    builddir: true
    no-make-install: true
    build-options:
      cflags: -O3 -DXBOX=1 -Wno-error=redundant-decls
    config-opts:
      - --audio-drv-list=sdl
      - --disable-werror
      - --target-list=i386-softmmu
    make-args:
      - qemu-system-i386
    post-install:
      - |-
        for px in 16 32 48 64 128 256 512; do
          install -Dm644 ../ui/icons/xemu_${px}x${px}.png $FLATPAK_DEST/share/icons/hicolor/${px}x${px}/apps/app.xemu.xemu.png
        done
      - install -Dm644 ../ui/icons/xemu.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/app.xemu.xemu.svg
      - desktop-file-install ../ui/xemu.desktop --dir $FLATPAK_DEST/share/applications
      - desktop-file-edit --set-icon=app.xemu.xemu $FLATPAK_DEST/share/applications/xemu.desktop
      - mv qemu-system-i386 $FLATPAK_DEST/bin/xemu
      - mkdir -p $FLATPAK_DEST/share/licenses/xemu
      - cd .. && python3 scripts/gen-license.py > $FLATPAK_DEST/share/licenses/xemu/LICENSE.txt
      - mkdir $FLATPAK_DEST/share/metainfo
      - cp ../xemu.metainfo.xml $FLATPAK_DEST/share/metainfo/app.xemu.xemu.metainfo.xml
      - sed -i 's|</component>|<releases><release date="2026-07-27" version="preview"/></releases></component>|' $FLATPAK_DEST/share/metainfo/app.xemu.xemu.metainfo.xml
    sources:
      # PenguinBox fork — build this working tree, not a xemu release tarball.
      - type: dir
        path: ..
        skip:
          - build
          - dist
          - .git
          - .flatpak-builder
